<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essentials</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1a1f2c;--muted:#616b7d;--border:#e4e7ee;--accent:#2f62d8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#171b22;--ink:#e9edf4;--muted:#99a3b4;--border:#262c37}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);display:grid;place-items:center;padding:24px}
.card{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:34px 38px;box-shadow:0 10px 30px rgba(16,24,40,.08)}
.ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;color:#fff;margin-bottom:18px}
.ic svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.9}
h1{margin:0 0 4px;font-size:25px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#8a6d1a;background:#fbf0d2;padding:3px 9px;border-radius:7px;margin-bottom:18px}
@media(prefers-color-scheme:dark){.tag{color:#e8c86a;background:#302916}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 10px}
ul{margin:0;padding-left:20px}li{margin:5px 0}
.row{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:11px;text-decoration:none;font-weight:600;font-size:14px;border:1px solid var(--border);color:var(--ink);background:var(--panel)}
a.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
a.btn:hover{opacity:.9}
.canvas{margin-top:22px;border:1px dashed var(--border);border-radius:12px;height:200px;display:grid;place-items:center;color:var(--muted);font-size:13px;position:relative;overflow:hidden}
</style></head><body>
<div class="card">
 <div class="ic" id="ic"></div>
 <span class="tag" id="tag">Early preview · v0</span>
 <h1 id="title">App</h1>
 <p class="sub" id="sub"></p>
 <h2>Planned toolset</h2>
 <ul id="tools"></ul>
 <div class="canvas" id="canvas">Workspace preview</div>
 <div class="row">
  <a class="btn" href="../index.html" id="back">← Back to launcher</a>
  <a class="btn p" href="#" id="docs">About this app</a>
 </div>
</div>
<script>
const APPDEF={
 solid:{t:'Solid',c:'#0ea5a5',sub:'Parametric 3D modelling — sketch, extrude and build solids. Inspired by SolidCraft / Fusion-style CAD.',
   ic:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 2v20M3 7l9 5 9-5"/>',
   tools:['Sketch plane with constraints (coincident, parallel, dimension)','Extrude / revolve / sweep / loft to solids','Boolean union, cut & intersect','Fillet & chamfer edges','Parametric history tree with editable features','Export STEP / STL / OBJ for Linework & slicers'],back:'../index.html'},
 texture:{t:'Texture',c:'#64748b',sub:'Paint textures directly onto 3D models with PBR channels. Inspired by TextureCraft.',
   ic:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 13h18M3 18h18M8 3v18M13 3v18M18 3v18"/>',
   tools:['Import OBJ / glTF models with UV layout','Paint base color, roughness, metallic & normal','Layer stack with masks & blend modes','Smart materials & stencil projection','Bake ambient occlusion & curvature','Export PBR texture sets (PNG / EXR)'],back:'../index.html'},
 material:{t:'Material',c:'#9b7653',sub:'Build procedural materials from a node graph. Inspired by MaterialCraft.',
   ic:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18M5 7c4 2 10 2 14 0M5 17c4-2 10-2 14 0"/>',
   tools:['Node graph: noise, gradient, shape & math nodes','PBR output: albedo, normal, roughness, height','Live 3D sphere/plane preview','Tiling & seamless controls','Expose parameters for reuse','Export to Texture & Pixel'],back:'../index.html'},
 lumen:{t:'Lumen',c:'#d4a72a',sub:'Catalogue photos and develop RAW files non-destructively. Inspired by LightCraft.',
   ic:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="8" cy="9" r="1.6"/>',
   tools:['Library with folders, ratings, flags & keywords','RAW develop: exposure, contrast, white balance, curves','HSL, split-tone & detail/sharpening','Crop, rotate & lens corrections','Copy/paste develop settings across photos','Export JPEG/TIFF or hand off to Develop & Pixel'],back:'../index.html'},
};
const p=new URLSearchParams(location.search);
const d=APPDEF[p.get('app')]||APPDEF.solid;
document.getElementById('ic').style.background=d.c;
document.getElementById('ic').innerHTML='<svg viewBox="0 0 24 24">'+d.ic+'</svg>';
document.getElementById('title').textContent=d.t;
document.getElementById('sub').textContent=d.sub;
document.title=d.t+' — Essentials';
document.getElementById('tools').innerHTML=d.tools.map(t=>'<li>'+t+'</li>').join('');
document.getElementById('canvas').textContent=d.t+' workspace — tools arriving in upcoming builds';
document.getElementById('docs').onclick=e=>{e.preventDefault();alert(d.t+'\n\n'+d.sub+'\n\nThis is an early preview scaffold. The core workspace and the tools listed are being built out in upcoming releases. Everything runs locally.');};
</script></body></html>
